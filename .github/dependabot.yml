# Keeps the commit-pinned third-party actions in .github/workflows current;
# without this the pins would silently fall behind.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
